<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Impossible Game WebSim Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="scanline-overlay">
        
        <div id="ui-layer">
            <div id="stats-bar">
                <div class="stat-box">Attempt: <span id="attempt-count">1</span></div>
                <div class="progress-display"><span id="score-display">0</span>m</div>
                <div class="stat-box">Best: <span id="best-score">0</span>m</div>
            </div>

            <button id="pause-btn">||</button>

            <!-- Start Screen -->
            <div id="start-screen" class="modal visible">
                <h1>IMPOSSIBLE CUBE</h1>
                <p>Music Sync: ON</p>
                <div class="controls-hint">Tap / Space to Jump</div>
                <button id="start-btn" class="glow-btn">START GAME</button>
            </div>

            <!-- Pause Menu -->
            <div id="pause-menu" class="modal hidden">
                <h2>PAUSED</h2>
                <button id="resume-btn" class="glow-btn">RESUME</button>
                <button id="restart-btn" class="glow-btn">RESTART</button>
                <div class="volume-control">
                    <label>Volume</label>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
                </div>
            </div>

            <!-- Game Over / Victory Overlay (Dynamic) -->
            <div id="message-overlay" class="modal hidden">
                <h2 id="msg-title"></h2>
                <p id="msg-stats"></p>
                <button id="msg-btn" class="glow-btn">TRY AGAIN</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>

</body>
</html>
